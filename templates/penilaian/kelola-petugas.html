{{ define "content" }}
<div class="space-y-6 md:space-y-8" x-data="kelolaPetugasPage()" x-init="init()">

    <div class="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4">
        <div>
            <h2 class="text-xl md:text-2xl font-bold text-gray-800">Kelola Petugas</h2>
            <p class="text-gray-500 mt-1 text-sm md:text-base">Daftarkan PPL, PML Mitra, dan tugaskan akun organik (PML/Korwil) untuk tiap kegiatan. Hanya admin yang bisa menambah/menghapus di sini — akun organik tidak bisa menilai kegiatan sampai ditugaskan di sini.</p>
        </div>
    </div>

    <template x-if="flash.message">
        <div class="rounded-2xl border px-4 py-3 text-sm font-medium"
            :class="flash.type === 'success' ? 'bg-emerald-50 border-emerald-200 text-emerald-700' : 'bg-red-50 border-red-200 text-red-700'">
            <div class="flex items-start justify-between gap-3">
                <span x-text="flash.message"></span>
                <button type="button" class="text-current/70 hover:text-current" @click="flash.message = ''">
                    <i class="fas fa-times"></i>
                </button>
            </div>
        </div>
    </template>

    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-5 md:p-6">
        <label class="block text-sm font-semibold text-gray-700 mb-2">Kegiatan</label>
        <div class="relative max-w-lg">
            <span class="form-icon"><i class="fas fa-magnifying-glass"></i></span>
            <input type="text" x-model="kegiatanSearch" @input="showKegiatanDropdown = true"
                @focus="showKegiatanDropdown = true; $el.select()" @click.away="showKegiatanDropdown = false"
                class="w-full input-with-icon" placeholder="Ketik untuk cari kegiatan...">
            <div x-show="showKegiatanDropdown && filteredKegiatanList().length > 0" x-cloak
                class="absolute z-20 w-full mt-1 bg-white shadow-xl rounded-xl border border-gray-200 max-h-64 overflow-y-auto">
                <template x-for="k in filteredKegiatanList()" :key="k.id">
                    <button type="button" @click="selectKegiatan(k)"
                        class="w-full px-4 py-3 text-left hover:bg-blue-50 transition border-b border-gray-100 last:border-0"
                        :class="String(k.id) === String(kegiatanId) ? 'bg-blue-50 font-semibold' : ''">
                        <span x-text="k.nama"></span>
                    </button>
                </template>
            </div>
        </div>
    </div>

    <template x-if="!kegiatanId">
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-10 text-center">
            <div class="w-16 h-16 rounded-full bg-gray-100 flex items-center justify-center mx-auto mb-4">
                <i class="fas fa-arrow-up text-2xl text-gray-400"></i>
            </div>
            <h3 class="text-base font-semibold text-gray-700">Pilih Kegiatan</h3>
            <p class="text-sm text-gray-500 mt-1">Pilih kegiatan untuk mengelola periode &amp; petugasnya.</p>
        </div>
    </template>

    <template x-if="kegiatanId">
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-5 md:p-6 space-y-4">
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">Periode</label>
                <p class="text-xs text-gray-400 mb-3">Roster petugas (PPL/PML/Korwil) berlaku khusus untuk satu periode — kegiatan yang sama bisa punya roster berbeda tiap periode.</p>
                <template x-if="loadingPeriode">
                    <p class="text-sm text-primary"><i class="fas fa-spinner fa-spin mr-2"></i>Memuat periode...</p>
                </template>
                <div class="flex flex-wrap gap-2" x-show="!loadingPeriode">
                    <template x-for="p in periodeList" :key="p.id">
                        <button type="button" @click="selectPeriode(p)"
                            class="px-4 py-2 rounded-xl border text-sm font-medium transition"
                            :class="String(p.id) === String(periodeId) ? 'bg-primary text-white border-primary' : 'bg-white text-gray-700 border-gray-200 hover:bg-gray-50'">
                            <span x-text="p.periode + ' ' + p.tahun"></span>
                        </button>
                    </template>
                    <template x-if="!loadingPeriode && periodeList.length === 0">
                        <p class="text-sm text-gray-500 py-2">Belum ada periode untuk kegiatan ini.</p>
                    </template>
                </div>
            </div>

            <div class="border-t border-gray-100 pt-4">
                <p class="text-sm font-semibold text-gray-700 mb-2">+ Tambah Periode Baru</p>
                <div class="flex flex-col sm:flex-row gap-2">
                    <input type="text" x-model="newPeriode" placeholder="cth: Triwulan I"
                        class="w-full sm:w-56" @keydown.enter="addPeriode()">
                    <input type="text" x-model="newTahun" placeholder="Tahun (cth: 2026)"
                        class="w-full sm:w-32" @keydown.enter="addPeriode()">
                    <button type="button" @click="addPeriode()" :disabled="addingPeriode || !newPeriode || !newTahun"
                        class="px-4 py-2.5 bg-primary text-white rounded-xl font-medium disabled:opacity-60 disabled:cursor-not-allowed whitespace-nowrap">
                        <i class="fas mr-1" :class="addingPeriode ? 'fa-spinner fa-spin' : 'fa-plus'"></i> Tambah
                    </button>
                </div>
            </div>
        </div>
    </template>

    <template x-if="kegiatanId && !periodeId">
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-10 text-center">
            <div class="w-16 h-16 rounded-full bg-gray-100 flex items-center justify-center mx-auto mb-4">
                <i class="fas fa-arrow-up text-2xl text-gray-400"></i>
            </div>
            <h3 class="text-base font-semibold text-gray-700">Pilih Periode</h3>
            <p class="text-sm text-gray-500 mt-1">Pilih atau tambahkan periode untuk mengelola daftar petugasnya.</p>
        </div>
    </template>

    <template x-if="periodeId">
        <div class="grid lg:grid-cols-3 gap-6">
            <template x-for="peranTab in ['ppl', 'pml', 'korwil']" :key="peranTab">
                <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                    <div class="px-5 py-4 border-b border-gray-100 flex items-center justify-between">
                        <div>
                            <h3 class="font-semibold text-gray-900" x-text="tabLabel(peranTab)"></h3>
                            <p class="text-xs text-gray-400 mt-0.5" x-text="tabHint(peranTab)"></p>
                        </div>
                        <span class="inline-flex px-2.5 py-1 rounded-full text-xs font-semibold bg-blue-100 text-blue-700"
                            x-text="rosterFor(peranTab).length + ' orang'"></span>
                    </div>

                    <div class="p-4 border-b border-gray-100 space-y-3">
                        <div class="relative">
                            <span class="form-icon"><i class="fas fa-magnifying-glass"></i></span>
                            <input type="text" x-model="addSearch[peranTab]" @input="searchFor(peranTab)"
                                class="w-full input-with-icon text-sm"
                                :placeholder="peranTab === 'ppl' ? 'Cari nama / ID Sobat mitra...' : 'Cari mitra atau akun organik...'">
                        </div>
                        <div x-show="addResults[peranTab] && addResults[peranTab].length > 0" class="border border-gray-200 rounded-xl max-h-48 overflow-y-auto divide-y divide-gray-100">
                            <template x-for="m in addResults[peranTab]" :key="m.tipe + ':' + (m.idsobat || m.user_id)">
                                <button type="button" @click="addToRoster(peranTab, m)"
                                    class="w-full px-3 py-2 text-left hover:bg-blue-50 transition flex items-center justify-between gap-2">
                                    <span class="min-w-0">
                                        <span class="block text-sm font-medium text-gray-900 truncate" x-text="m.nama"></span>
                                        <span class="block text-xs text-gray-500 truncate" x-text="(m.tipe === 'organik' ? m.email : m.idsobat + (m.kecamatan ? ' · ' + m.kecamatan : ''))"></span>
                                    </span>
                                    <span class="flex-shrink-0 inline-flex items-center gap-2">
                                        <span class="inline-flex px-2 py-0.5 rounded-full text-[10px] font-semibold"
                                            :class="m.tipe === 'organik' ? 'bg-purple-100 text-purple-700' : 'bg-gray-100 text-gray-600'"
                                            x-text="m.tipe === 'organik' ? 'Organik' : 'Mitra'"></span>
                                        <i class="fas fa-plus text-primary"></i>
                                    </span>
                                </button>
                            </template>
                        </div>
                    </div>

                    <template x-if="loading">
                        <div class="p-6 text-sm text-primary inline-flex items-center">
                            <i class="fas fa-spinner fa-spin mr-2"></i> Memuat...
                        </div>
                    </template>

                    <template x-if="!loading && rosterFor(peranTab).length === 0">
                        <div class="p-8 text-center text-sm text-gray-500">Belum ada petugas terdaftar.</div>
                    </template>

                    <div class="divide-y divide-gray-100 max-h-96 overflow-y-auto">
                        <template x-for="p in rosterFor(peranTab)" :key="p.tipe + ':' + (p.idsobat || p.user_id)">
                            <div class="flex items-center justify-between gap-3 px-5 py-3">
                                <div class="min-w-0 flex items-center gap-2">
                                    <div class="min-w-0">
                                        <p class="font-medium text-gray-900 truncate" x-text="p.nama"></p>
                                        <p class="text-xs text-gray-500 truncate" x-text="(p.tipe === 'organik' ? p.email : p.idsobat + (p.kecamatan ? ' · ' + p.kecamatan : ''))"></p>
                                    </div>
                                    <span class="flex-shrink-0 inline-flex px-2 py-0.5 rounded-full text-[10px] font-semibold"
                                        :class="p.tipe === 'organik' ? 'bg-purple-100 text-purple-700' : 'bg-gray-100 text-gray-600'"
                                        x-text="p.tipe === 'organik' ? 'Organik' : 'Mitra'"></span>
                                </div>
                                <button type="button" @click="removeFromRoster(p)" class="text-red-500 hover:text-red-700 flex-shrink-0" title="Hapus dari kegiatan">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </div>
                        </template>
                    </div>
                </div>
            </template>
        </div>
    </template>
</div>

<script>
    function kelolaPetugasPage() {
        return {
            kegiatanId: '',
            kegiatanSearch: '',
            showKegiatanDropdown: false,
            kegiatanList: [],
            periodeId: '',
            periodeList: [],
            loadingPeriode: false,
            newPeriode: '',
            newTahun: '',
            addingPeriode: false,
            roster: [],
            loading: false,
            flash: { type: '', message: '' },
            addSearch: { ppl: '', pml: '', korwil: '' },
            addResults: { ppl: [], pml: [], korwil: [] },
            addSearchTimer: {},

            init() {
                this.loadKegiatan();
            },

            tabLabel(peranTab) {
                return { ppl: 'Daftar PPL', pml: 'Daftar PML', korwil: 'Daftar Korwil' }[peranTab];
            },

            tabHint(peranTab) {
                return {
                    ppl: 'Mitra yang dinilai sebagai PPL',
                    pml: 'Mitra (PML Mitra, dinilai Korwil) & akun organik (ditugaskan menilai PPL)',
                    korwil: 'Akun organik yang ditugaskan menilai PML Mitra (opsional)',
                }[peranTab];
            },

            async loadKegiatan() {
                try {
                    const response = await fetch('/api/penilaian/kegiatan');
                    if (!response.ok) throw new Error('Gagal memuat kegiatan');
                    const result = await response.json();
                    this.kegiatanList = (result.data || []).map(k => ({ id: k.id, nama: k.nama }));
                } catch (error) {
                    this.flash = { type: 'error', message: error.message };
                }
            },

            filteredKegiatanList() {
                const query = this.kegiatanSearch.trim().toLowerCase();
                if (!query) return this.kegiatanList;
                return this.kegiatanList.filter(k => k.nama.toLowerCase().includes(query));
            },

            selectKegiatan(k) {
                this.kegiatanId = k.id;
                this.kegiatanSearch = k.nama;
                this.showKegiatanDropdown = false;
                this.periodeId = '';
                this.roster = [];
                this.addSearch = { ppl: '', pml: '', korwil: '' };
                this.addResults = { ppl: [], pml: [], korwil: [] };
                this.loadPeriode();
            },

            async loadPeriode() {
                if (!this.kegiatanId) { this.periodeList = []; return; }
                this.loadingPeriode = true;
                try {
                    const response = await fetch(`/api/penilaian/kegiatan/periode?kegiatan_id=${this.kegiatanId}`);
                    if (!response.ok) throw new Error('Gagal memuat periode');
                    const result = await response.json();
                    this.periodeList = result.data || [];
                } catch (error) {
                    this.flash = { type: 'error', message: error.message };
                } finally {
                    this.loadingPeriode = false;
                }
            },

            selectPeriode(p) {
                this.periodeId = p.id;
                this.addSearch = { ppl: '', pml: '', korwil: '' };
                this.addResults = { ppl: [], pml: [], korwil: [] };
                this.loadRoster();
            },

            async addPeriode() {
                if (!this.newPeriode || !this.newTahun) return;
                this.addingPeriode = true;
                try {
                    const response = await fetch('/api/penilaian/kegiatan/periode', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ kegiatan_id: Number(this.kegiatanId), periode: this.newPeriode, tahun: this.newTahun }),
                    });
                    const result = await response.json();
                    if (!response.ok) throw new Error(result?.error?.message || 'Gagal menambahkan periode');
                    this.flash = { type: 'success', message: 'Periode ditambahkan.' };
                    this.newPeriode = '';
                    this.newTahun = '';
                    await this.loadPeriode();
                    if (result.id) this.selectPeriode({ id: result.id });
                } catch (error) {
                    this.flash = { type: 'error', message: error.message };
                } finally {
                    this.addingPeriode = false;
                }
            },

            async loadRoster() {
                if (!this.periodeId) { this.roster = []; return; }
                this.loading = true;
                try {
                    const response = await fetch(`/api/penilaian/kegiatan/petugas?periode_id=${this.periodeId}`);
                    if (!response.ok) throw new Error('Gagal memuat daftar petugas');
                    const result = await response.json();
                    this.roster = result.data || [];
                } catch (error) {
                    this.flash = { type: 'error', message: error.message };
                } finally {
                    this.loading = false;
                }
            },

            rosterFor(peran) {
                return this.roster.filter(p => p.peran === peran);
            },

            searchFor(peranTab) {
                clearTimeout(this.addSearchTimer[peranTab]);
                this.addSearchTimer[peranTab] = setTimeout(async () => {
                    const q = this.addSearch[peranTab];
                    if (!q) { this.addResults[peranTab] = []; return; }
                    try {
                        if (peranTab === 'ppl') {
                            this.addResults[peranTab] = await this.searchMitra(q);
                        } else if (peranTab === 'korwil') {
                            this.addResults[peranTab] = await this.searchOrganik(q);
                        } else {
                            // pml: gabungan mitra (PML Mitra) + organik (ditugaskan PML)
                            const [mitra, organik] = await Promise.all([this.searchMitra(q), this.searchOrganik(q)]);
                            this.addResults[peranTab] = [...mitra, ...organik];
                        }
                    } catch (error) {
                        this.flash = { type: 'error', message: error.message };
                    }
                }, 300);
            },

            async searchMitra(q) {
                const response = await fetch('/api/penilaian/mitra?q=' + encodeURIComponent(q));
                if (!response.ok) throw new Error('Gagal mencari mitra');
                const result = await response.json();
                return (result.data || []).map(m => ({ ...m, tipe: 'mitra' }));
            },

            async searchOrganik(q) {
                const response = await fetch('/api/penilaian/penilai/search?q=' + encodeURIComponent(q));
                if (!response.ok) throw new Error('Gagal mencari akun organik');
                const result = await response.json();
                return (result.data || []).map(u => ({ ...u, tipe: 'organik' }));
            },

            async addToRoster(peranTab, item) {
                try {
                    const body = { periode_id: Number(this.periodeId), peran: peranTab };
                    if (item.tipe === 'organik') {
                        body.user_id = item.user_id;
                    } else {
                        body.idsobat = item.idsobat;
                    }
                    const response = await fetch('/api/penilaian/kegiatan/petugas', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(body),
                    });
                    const result = await response.json();
                    if (!response.ok) throw new Error(result?.error?.message || 'Gagal menambahkan petugas');
                    this.flash = { type: 'success', message: item.nama + ' ditambahkan.' };
                    this.addSearch[peranTab] = '';
                    this.addResults[peranTab] = [];
                    await this.loadRoster();
                } catch (error) {
                    this.flash = { type: 'error', message: error.message };
                }
            },

            async removeFromRoster(p) {
                try {
                    const params = new URLSearchParams({ periode_id: this.periodeId });
                    if (p.tipe === 'organik') {
                        params.set('user_id', p.user_id);
                    } else {
                        params.set('idsobat', p.idsobat);
                    }
                    const response = await fetch(`/api/penilaian/kegiatan/petugas?${params.toString()}`, {
                        method: 'DELETE',
                    });
                    const result = await response.json();
                    if (!response.ok) throw new Error(result?.error?.message || 'Gagal menghapus petugas');
                    this.flash = { type: 'success', message: p.nama + ' dihapus dari kegiatan.' };
                    await this.loadRoster();
                } catch (error) {
                    this.flash = { type: 'error', message: error.message };
                }
            },
        };
    }
</script>
{{ end }}
