{{ define "content" }}
<div class="space-y-6 md:space-y-8" x-data="penilaianRekapPage()" x-init="init()">

    <div class="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4">
        <div>
            <h2 class="text-xl md:text-2xl font-bold text-gray-800">Penilaian PML Mitra</h2>
            <p class="text-gray-500 mt-1 text-sm md:text-base">Subject Matter menilai langsung kinerja PML Mitra. Penilaian PPL oleh PML bersifat final dan tidak memerlukan review di sini.</p>
        </div>
    </div>

    <template x-if="flash.message">
        <div class="rounded-2xl border px-4 py-3 text-sm font-medium"
            :class="flash.type === 'success' ? 'bg-emerald-50 border-emerald-200 text-emerald-700' : 'bg-red-50 border-red-200 text-red-700'">
            <div class="flex items-start justify-between gap-3">
                <span x-text="flash.message"></span>
                <button type="button" class="text-current/70 hover:text-current" @click="flash.message = ''">
                    <i class="fas fa-times"></i>
                </button>
            </div>
        </div>
    </template>

    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-5 md:p-6">
        <label class="block text-sm font-semibold text-gray-700 mb-2">Kegiatan Statistik (PML)</label>
        <div class="relative max-w-lg">
            <span class="form-icon"><i class="fas fa-magnifying-glass"></i></span>
            <input type="text" x-model="kegiatanSearch" @input="showKegiatanDropdown = true"
                @focus="showKegiatanDropdown = true; $el.select()" @click.away="showKegiatanDropdown = false"
                class="w-full input-with-icon" placeholder="Ketik untuk cari kegiatan...">
            <div x-show="showKegiatanDropdown && filteredKegiatanList().length > 0" x-cloak
                class="absolute z-20 w-full mt-1 bg-white shadow-xl rounded-xl border border-gray-200 max-h-64 overflow-y-auto">
                <template x-for="k in filteredKegiatanList()" :key="k.id">
                    <button type="button" @click="selectKegiatan(k)"
                        class="w-full px-4 py-3 text-left hover:bg-blue-50 transition border-b border-gray-100 last:border-0"
                        :class="String(k.id) === String(kegiatanId) ? 'bg-blue-50 font-semibold' : ''">
                        <span x-text="k.nama"></span>
                    </button>
                </template>
            </div>
            <div x-show="showKegiatanDropdown && kegiatanSearch && filteredKegiatanList().length === 0" x-cloak
                class="absolute z-20 w-full mt-1 bg-white shadow-xl rounded-xl border border-gray-200 px-4 py-3 text-sm text-gray-500">
                Tidak ada kegiatan yang cocok.
            </div>
        </div>
    </div>

    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
        <div class="px-5 py-4 border-b border-gray-100 space-y-3">
            <div class="flex items-center justify-between gap-3">
                <h3 class="font-semibold text-gray-900">Daftar PML Mitra</h3>
                <span class="inline-flex px-2.5 py-1 rounded-full text-xs font-semibold bg-blue-100 text-blue-700"
                    x-text="filteredRekapList().length + ' / ' + rekapList.length + ' orang'"></span>
            </div>
            <div class="relative max-w-sm" x-show="rekapList.length > 5">
                <span class="form-icon"><i class="fas fa-magnifying-glass"></i></span>
                <input type="text" x-model="mitraSearch" class="w-full input-with-icon text-sm"
                    placeholder="Cari nama PML Mitra...">
            </div>
        </div>

        <template x-if="loading">
            <div class="p-6 text-sm text-primary inline-flex items-center">
                <i class="fas fa-spinner fa-spin mr-2"></i> Memuat data...
            </div>
        </template>

        <template x-if="!loading && kegiatanId && rekapList.length === 0">
            <div class="p-8 md:p-12 text-center">
                <div class="w-16 h-16 rounded-full bg-gray-100 flex items-center justify-center mx-auto mb-4">
                    <i class="fas fa-inbox text-2xl text-gray-400"></i>
                </div>
                <h3 class="text-base font-semibold text-gray-700">Belum Ada Data</h3>
                <p class="text-sm text-gray-500 mt-1">Tidak ada PML Mitra pada kegiatan ini.</p>
            </div>
        </template>

        <template x-if="!loading && rekapList.length > 0 && filteredRekapList().length === 0">
            <div class="p-8 md:p-12 text-center">
                <div class="w-16 h-16 rounded-full bg-gray-100 flex items-center justify-center mx-auto mb-4">
                    <i class="fas fa-magnifying-glass text-2xl text-gray-400"></i>
                </div>
                <h3 class="text-base font-semibold text-gray-700">Tidak Ditemukan</h3>
                <p class="text-sm text-gray-500 mt-1">Tidak ada PML Mitra dengan nama tersebut.</p>
            </div>
        </template>

        <div class="overflow-x-auto" x-show="!loading && filteredRekapList().length > 0">
            <table class="w-full text-sm">
                <thead class="bg-gray-50 text-gray-600">
                    <tr>
                        <th class="px-4 py-3 text-left font-semibold">Nama</th>
                        <th class="px-4 py-3 text-right font-semibold">Nilai</th>
                        <th class="px-4 py-3 text-center font-semibold">Status</th>
                        <th class="px-4 py-3 text-center font-semibold">Aksi</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-gray-100">
                    <template x-for="item in filteredRekapList()" :key="item.mitra_id">
                        <tr class="hover:bg-gray-50">
                            <td class="px-4 py-3 font-medium text-gray-900" x-text="item.mitra_name"></td>
                            <td class="px-4 py-3 text-right font-bold text-primary" x-text="item.nilai ?? '-'"></td>
                            <td class="px-4 py-3 text-center">
                                <span class="inline-flex px-2.5 py-1 rounded-full text-xs font-semibold"
                                    :class="item.status_kelulusan === 'lulus' ? 'bg-emerald-100 text-emerald-700' : (item.status_kelulusan === 'perlu_perhatian' ? 'bg-red-100 text-red-700' : 'bg-amber-100 text-amber-700')"
                                    x-text="statusLabel(item.status_kelulusan)"></span>
                            </td>
                            <td class="px-4 py-3 text-center">
                                <button type="button" @click="openScoreModal(item)"
                                    class="text-primary hover:text-primary-dark font-medium">
                                    <i class="fas fa-pen mr-1"></i> Nilai
                                </button>
                            </td>
                        </tr>
                    </template>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Score PML Modal -->
    <div x-show="modalOpen" x-cloak x-transition class="fixed inset-0 z-50 flex items-center justify-center p-4"
        style="background: rgba(15, 23, 42, 0.5);">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg overflow-hidden" @click.outside="modalOpen = false">
            <div class="px-6 py-4 border-b border-gray-100 flex items-center justify-between">
                <h3 class="font-semibold text-gray-900">Penilaian PML Mitra &mdash; <span x-text="modalItem?.mitra_name"></span></h3>
                <button @click="modalOpen = false" class="w-9 h-9 rounded-full hover:bg-gray-100 text-gray-500">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <form @submit.prevent="submitPenilaian()" class="p-6 space-y-5">
                <template x-for="crit in criteria" :key="crit.key">
                    <div class="space-y-2">
                        <div class="flex items-center justify-between">
                            <label class="block text-sm font-semibold text-gray-700" x-text="crit.label"></label>
                            <span class="text-lg font-bold text-primary" x-text="modalForm[crit.key]"></span>
                        </div>
                        <input type="range" min="1" max="100" x-model.number="modalForm[crit.key]" class="w-full accent-primary">
                    </div>
                </template>
                <div class="space-y-2">
                    <label class="block text-sm font-semibold text-gray-700">Catatan (opsional)</label>
                    <textarea x-model="modalForm.catatan" rows="3" class="w-full"></textarea>
                </div>
                <div class="flex gap-3">
                    <button type="submit" :disabled="modalSubmitting"
                        class="flex-1 inline-flex items-center justify-center px-5 py-3 bg-primary text-white rounded-xl hover:bg-primary-dark transition font-semibold disabled:opacity-60">
                        <i class="fas mr-2" :class="modalSubmitting ? 'fa-spinner fa-spin' : 'fa-check'"></i>
                        <span x-text="modalSubmitting ? 'Menyimpan...' : 'Simpan Penilaian'"></span>
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    function penilaianRekapPage() {
        return {
            kegiatanId: '',
            kegiatanSearch: '',
            showKegiatanDropdown: false,
            kegiatanList: [],
            rekapList: [],
            mitraSearch: '',
            loading: false,
            flash: { type: '', message: '' },
            modalOpen: false,
            modalItem: null,
            modalSubmitting: false,
            criteria: [
                { key: 'skor_kualitas', label: 'Kualitas Hasil Kerja' },
                { key: 'skor_ketepatan_waktu', label: 'Ketepatan Waktu' },
                { key: 'skor_kepatuhan_sop', label: 'Kepatuhan terhadap SOP' },
                { key: 'skor_komunikasi', label: 'Komunikasi dan Koordinasi' },
                { key: 'skor_sikap', label: 'Sikap dan Perilaku' },
            ],
            modalForm: { skor_kualitas: 80, skor_ketepatan_waktu: 80, skor_kepatuhan_sop: 80, skor_komunikasi: 80, skor_sikap: 80, catatan: '' },

            init() {
                this.loadKegiatan();
            },

            async loadKegiatan() {
                try {
                    const response = await fetch('/api/penilaian/kegiatan?peran=pml');
                    if (!response.ok) throw new Error('Gagal memuat kegiatan');
                    const result = await response.json();
                    this.kegiatanList = (result.data || []).map(k => ({ id: k.id, nama: k.nama }));
                } catch (error) {
                    this.flash = { type: 'error', message: error.message };
                }
            },

            filteredKegiatanList() {
                const query = this.kegiatanSearch.trim().toLowerCase();
                if (!query) return this.kegiatanList;
                return this.kegiatanList.filter(k => k.nama.toLowerCase().includes(query));
            },

            selectKegiatan(k) {
                this.kegiatanId = k.id;
                this.kegiatanSearch = k.nama;
                this.showKegiatanDropdown = false;
                this.mitraSearch = '';
                this.loadRekap();
            },

            async loadRekap() {
                if (!this.kegiatanId) { this.rekapList = []; return; }
                this.loading = true;
                try {
                    const response = await fetch(`/api/penilaian/rekap?kegiatan_id=${this.kegiatanId}`);
                    if (!response.ok) throw new Error('Gagal memuat data');
                    const result = await response.json();
                    this.rekapList = result.data || [];
                } catch (error) {
                    this.flash = { type: 'error', message: error.message };
                } finally {
                    this.loading = false;
                }
            },

            filteredRekapList() {
                const query = this.mitraSearch.trim().toLowerCase();
                if (!query) return this.rekapList;
                return this.rekapList.filter(item => item.mitra_name.toLowerCase().includes(query));
            },

            statusLabel(status) {
                if (status === 'lulus') return 'Lulus';
                if (status === 'perlu_perhatian') return 'Perlu Perhatian';
                return 'Belum Dinilai';
            },

            openScoreModal(item) {
                this.modalItem = item;
                this.modalForm = { skor_kualitas: 80, skor_ketepatan_waktu: 80, skor_kepatuhan_sop: 80, skor_komunikasi: 80, skor_sikap: 80, catatan: '' };
                this.modalOpen = true;
            },

            async submitPenilaian() {
                if (!this.modalItem) return;
                this.modalSubmitting = true;
                try {
                    const response = await fetch('/api/penilaian', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            kegiatan_id: Number(this.kegiatanId),
                            yang_dinilai_id: this.modalItem.mitra_id,
                            tahap: 2,
                            skor_kualitas: this.modalForm.skor_kualitas,
                            skor_ketepatan_waktu: this.modalForm.skor_ketepatan_waktu,
                            skor_kepatuhan_sop: this.modalForm.skor_kepatuhan_sop,
                            skor_komunikasi: this.modalForm.skor_komunikasi,
                            skor_sikap: this.modalForm.skor_sikap,
                            catatan: this.modalForm.catatan,
                        }),
                    });
                    const result = await response.json();
                    if (!response.ok) throw new Error(result?.error?.message || 'Gagal menyimpan penilaian');
                    this.flash = { type: 'success', message: 'Penilaian PML Mitra tersimpan.' };
                    this.modalOpen = false;
                    await this.loadRekap();
                } catch (error) {
                    this.flash = { type: 'error', message: error.message };
                } finally {
                    this.modalSubmitting = false;
                }
            },
        };
    }
</script>
{{ end }}
