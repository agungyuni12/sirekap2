{{ define "content" }}
<div class="space-y-6 md:space-y-8" x-data="penilaianInputPage('{{ .PenilaianPeran }}', '{{ .UserRole }}')" x-init="init()">

    <div class="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4">
        <div>
            <h2 class="text-xl md:text-2xl font-bold text-gray-800">{{ .PenilaianTitle }}</h2>
            <p class="text-gray-500 mt-1 text-sm md:text-base">{{ .PenilaianSubtitle }}</p>
        </div>
        <a href="/penilaian/daftar"
            class="inline-flex items-center justify-center px-4 py-2.5 bg-white border border-gray-200 text-gray-700 rounded-xl hover:bg-gray-50 transition font-medium shadow-sm">
            <i class="fas fa-list-check mr-2 text-primary"></i> Daftar Penilaian
        </a>
    </div>

    <template x-if="flash.message">
        <div class="rounded-2xl border px-4 py-3 text-sm font-medium"
            :class="flash.type === 'success' ? 'bg-emerald-50 border-emerald-200 text-emerald-700' : 'bg-red-50 border-red-200 text-red-700'">
            <div class="flex items-start justify-between gap-3">
                <span x-text="flash.message"></span>
                <button type="button" class="text-current/70 hover:text-current" @click="flash.message = ''">
                    <i class="fas fa-times"></i>
                </button>
            </div>
        </div>
    </template>

    <form @submit.prevent="submitPenilaian()" class="bg-white rounded-2xl shadow-sm border border-gray-100 p-5 md:p-6 space-y-6">

        <div class="grid md:grid-cols-2 gap-5">
            <div class="md:col-span-2 space-y-2">
                <label class="block text-sm font-semibold text-gray-700">Kegiatan</label>

                <template x-if="mine && !loadingKegiatan && kegiatanList.length === 0">
                    <p class="text-sm text-amber-700 bg-amber-50 border border-amber-200 rounded-xl px-4 py-3">
                        Anda belum ditugaskan ke kegiatan manapun. Hubungi admin untuk ditugaskan lewat menu <strong>Kelola Petugas</strong>.
                    </p>
                </template>

                <div class="relative" x-show="!mine || loadingKegiatan || kegiatanList.length > 0">
                    <span class="form-icon"><i class="fas fa-magnifying-glass"></i></span>
                    <input type="text" x-model="kegiatanSearch" @input="showKegiatanDropdown = true"
                        @focus="showKegiatanDropdown = true; $el.select()" @click.away="showKegiatanDropdown = false"
                        class="w-full input-with-icon" placeholder="Ketik untuk cari kegiatan...">
                    <div x-show="showKegiatanDropdown && filteredKegiatanList().length > 0" x-cloak
                        class="absolute z-20 w-full mt-1 bg-white shadow-xl rounded-xl border border-gray-200 max-h-64 overflow-y-auto">
                        <template x-for="k in filteredKegiatanList()" :key="k.id">
                            <button type="button" @click="selectKegiatan(k)"
                                class="w-full px-4 py-3 text-left hover:bg-blue-50 transition border-b border-gray-100 last:border-0"
                                :class="String(k.id) === String(kegiatanId) ? 'bg-blue-50 font-semibold' : ''">
                                <span x-text="k.nama"></span>
                                <span x-show="k.peran" class="ml-2 inline-flex px-2 py-0.5 rounded-full text-xs font-semibold bg-amber-100 text-amber-700" x-text="k.peran === 'korwil' ? 'Korwil' : 'PML'"></span>
                            </button>
                        </template>
                    </div>
                    <div x-show="showKegiatanDropdown && kegiatanSearch && filteredKegiatanList().length === 0" x-cloak
                        class="absolute z-20 w-full mt-1 bg-white shadow-xl rounded-xl border border-gray-200 px-4 py-3 text-sm text-gray-500">
                        Tidak ada kegiatan yang cocok.
                    </div>
                </div>
            </div>

            <div class="space-y-2">
                <label class="block text-sm font-semibold text-gray-700">Periode</label>
                <input type="text" x-model="form_periode" placeholder="cth: Triwulan I, Maret 2026" class="w-full">
            </div>
            <div class="space-y-2">
                <label class="block text-sm font-semibold text-gray-700">Tahun</label>
                <select x-model="form_tahun" class="w-full">
                    <template x-for="y in tahunOptions" :key="y">
                        <option :value="y" x-text="y"></option>
                    </template>
                </select>
            </div>

            <div class="md:col-span-2 space-y-2">
                <label class="block text-sm font-semibold text-gray-700">Nama Petugas</label>

                <template x-if="!kegiatanId">
                    <p class="text-sm text-gray-500 bg-gray-50 rounded-xl px-4 py-3">Pilih kegiatan terlebih dahulu untuk melihat daftar petugas.</p>
                </template>

                <template x-if="kegiatanId && loadingRoster">
                    <p class="text-sm text-primary bg-gray-50 rounded-xl px-4 py-3"><i class="fas fa-spinner fa-spin mr-2"></i>Memuat daftar petugas...</p>
                </template>

                <template x-if="kegiatanId && !loadingRoster && rosterList.length === 0">
                    <p class="text-sm text-amber-700 bg-amber-50 border border-amber-200 rounded-xl px-4 py-3">
                        Belum ada petugas terdaftar untuk kegiatan ini. Hubungi admin untuk menambahkan lewat menu <strong>Kelola Petugas</strong>.
                    </p>
                </template>

                <template x-if="kegiatanId && !loadingRoster && rosterList.length > 0">
                    <div class="relative">
                        <span class="form-icon"><i class="fas fa-magnifying-glass"></i></span>
                        <input type="text" x-model="petugasSearch" @input="showPetugasDropdown = true"
                            @focus="showPetugasDropdown = true" @click.away="showPetugasDropdown = false"
                            class="w-full input-with-icon" placeholder="Cari dari daftar petugas kegiatan ini...">
                        <div x-show="showPetugasDropdown && filteredRoster().length > 0" x-cloak
                            class="absolute z-20 w-full mt-1 bg-white shadow-xl rounded-xl border border-gray-200 max-h-64 overflow-y-auto">
                            <template x-for="p in filteredRoster()" :key="p.idsobat">
                                <button type="button" @click="selectPetugas(p)"
                                    class="w-full px-4 py-3 text-left hover:bg-blue-50 transition border-b border-gray-100 last:border-0">
                                    <p class="font-medium text-gray-900" x-text="p.nama"></p>
                                    <p class="text-xs text-gray-500" x-text="p.idsobat + (p.kecamatan ? ' · ' + p.kecamatan : '')"></p>
                                </button>
                            </template>
                        </div>
                        <div x-show="showPetugasDropdown && petugasSearch && filteredRoster().length === 0" x-cloak
                            class="absolute z-20 w-full mt-1 bg-white shadow-xl rounded-xl border border-gray-200 px-4 py-3 text-sm text-gray-500">
                            Tidak ada petugas yang cocok.
                        </div>
                    </div>
                </template>

                <template x-if="selected">
                    <div class="flex items-center gap-3 bg-gray-50 rounded-xl p-3 mt-1">
                        <div class="w-10 h-10 rounded-full bg-gradient-to-br from-blue-500 to-indigo-600 text-white flex items-center justify-center text-sm font-bold shadow flex-shrink-0"
                            x-text="initials(selected.nama)"></div>
                        <div class="min-w-0">
                            <p class="font-semibold text-gray-900 truncate" x-text="selected.nama"></p>
                            <p class="text-xs text-gray-500" x-text="selected.idsobat"></p>
                        </div>
                    </div>
                </template>
            </div>

            <div class="space-y-2">
                <label class="block text-sm font-semibold text-gray-700">Peran</label>
                <div class="inline-flex px-3 py-2.5 rounded-xl bg-amber-50 border border-amber-200 text-amber-700 font-semibold text-sm w-full justify-center"
                    x-text="peran === 'pml' ? 'PML Mitra' : 'PPL'"></div>
            </div>
            <div class="space-y-2">
                <label class="block text-sm font-semibold text-gray-700">Wilayah Tugas (Kecamatan)</label>
                <input type="text" x-model="form_kecamatan" placeholder="Kecamatan" class="w-full">
            </div>

            <div class="space-y-2">
                <label class="block text-sm font-semibold text-gray-700">Tanggal Penilaian</label>
                <input type="date" x-model="form_tanggal" class="w-full">
            </div>
            <div class="space-y-2">
                <label class="block text-sm font-semibold text-gray-700">Nama Penilai</label>
                <input type="text" :value="userName" disabled class="w-full bg-gray-50 text-gray-500">
            </div>
        </div>

        <div class="border-t border-gray-100 pt-6 space-y-5">
            <h3 class="font-semibold text-gray-900">Bobot Aspek Penilaian</h3>
            <template x-for="crit in criteria" :key="crit.key">
                <div class="space-y-2">
                    <div class="flex items-center justify-between">
                        <label class="block text-sm font-semibold text-gray-700">
                            <span x-text="crit.label"></span>
                            <span class="text-gray-400 font-normal" x-text="'(' + crit.bobotLabel + ')'"></span>
                        </label>
                        <span class="text-lg font-bold text-primary" x-text="form[crit.key]"></span>
                    </div>
                    <input type="range" min="1" max="100" x-model.number="form[crit.key]" class="w-full accent-primary">
                </div>
            </template>
        </div>

        <div class="space-y-2">
            <label class="block text-sm font-semibold text-gray-700">Catatan (opsional)</label>
            <textarea x-model="form.catatan" rows="4"
                placeholder="Catatan singkat mengenai kinerja..."
                class="w-full"></textarea>
        </div>

        <div class="flex flex-col sm:flex-row gap-3">
            <button type="submit" :disabled="submitting || !kegiatanId || !selected"
                class="inline-flex items-center justify-center px-5 py-3 bg-primary text-white rounded-xl hover:bg-primary-dark transition font-semibold disabled:opacity-60 disabled:cursor-not-allowed">
                <i class="fas mr-2" :class="submitting ? 'fa-spinner fa-spin' : 'fa-paper-plane'"></i>
                <span x-text="submitting ? 'Menyimpan...' : 'Simpan Penilaian'"></span>
            </button>
        </div>
    </form>
</div>

<script>
    function penilaianInputPage(peran, role) {
        return {
            peran: peran,
            // PML Mitra selalu menilai PPL untuk kegiatan apa saja (unchanged).
            // Semua role lain (organik, admin) hanya melihat & bisa menilai
            // kegiatan yang sudah ditugaskan admin lewat Kelola Petugas — peran
            // (PML/Korwil) ikut kegiatan yang dipilih, bukan tetap.
            mine: role !== 'pml_mitra',
            userName: '{{ .UserName }}',
            kegiatanId: '',
            kegiatanSearch: '',
            showKegiatanDropdown: false,
            kegiatanList: [],
            loadingKegiatan: false,
            petugasSearch: '',
            rosterList: [],
            loadingRoster: false,
            showPetugasDropdown: false,
            selected: null,
            submitting: false,
            flash: { type: '', message: '' },
            tahunOptions: [],
            form_periode: '',
            form_tahun: String(new Date().getFullYear()),
            form_kecamatan: '',
            form_tanggal: new Date().toISOString().slice(0, 10),
            criteria: [
                { key: 'skor_kualitas', label: 'Kualitas Hasil Kerja', bobotLabel: '30%' },
                { key: 'skor_ketepatan_waktu', label: 'Ketepatan Waktu', bobotLabel: '17,5%' },
                { key: 'skor_kepatuhan_sop', label: 'Kepatuhan terhadap SOP', bobotLabel: '17,5%' },
                { key: 'skor_komunikasi', label: 'Komunikasi & Koordinasi', bobotLabel: '17,5%' },
                { key: 'skor_sikap', label: 'Sikap/Perilaku', bobotLabel: '17,5%' },
            ],
            form: { skor_kualitas: 80, skor_ketepatan_waktu: 80, skor_kepatuhan_sop: 80, skor_komunikasi: 80, skor_sikap: 80, catatan: '' },

            init() {
                for (let y = new Date().getFullYear(); y >= new Date().getFullYear() - 4; y--) {
                    this.tahunOptions.push(String(y));
                }
                this.loadKegiatan();
            },

            async loadKegiatan() {
                this.loadingKegiatan = true;
                try {
                    const url = this.mine ? '/api/penilaian/kegiatan?mine=1' : '/api/penilaian/kegiatan';
                    const response = await fetch(url);
                    if (!response.ok) throw new Error('Gagal memuat kegiatan');
                    const result = await response.json();
                    this.kegiatanList = (result.data || []).map(k => ({ id: k.id, nama: k.nama, peran: k.peran || '' }));
                } catch (error) {
                    this.flash = { type: 'error', message: error.message };
                } finally {
                    this.loadingKegiatan = false;
                }
            },

            filteredKegiatanList() {
                const query = this.kegiatanSearch.trim().toLowerCase();
                if (!query) return this.kegiatanList;
                return this.kegiatanList.filter(k => k.nama.toLowerCase().includes(query));
            },

            selectKegiatan(k) {
                this.kegiatanId = k.id;
                this.kegiatanSearch = k.nama;
                this.showKegiatanDropdown = false;
                this.selected = null;
                this.petugasSearch = '';
                // Untuk role dgn peran dinamis (organik/admin): peran ikut kegiatan
                // yang dipilih (k.peran dari /api/penilaian/kegiatan?mine=1 — 'pml'
                // artinya menilai PPL, 'korwil' artinya menilai PML Mitra).
                if (this.mine && k.peran) {
                    this.peran = k.peran === 'korwil' ? 'pml' : 'ppl';
                }
                this.loadRoster();
            },

            async loadRoster() {
                if (!this.kegiatanId) { this.rosterList = []; return; }
                this.loadingRoster = true;
                try {
                    const response = await fetch(`/api/penilaian/kegiatan/petugas?kegiatan_id=${this.kegiatanId}&peran=${this.peran}`);
                    if (!response.ok) throw new Error('Gagal memuat daftar petugas');
                    const result = await response.json();
                    // Roster kegiatan sekarang bisa berisi entri organik (penilai,
                    // tidak punya idsobat) selain mitra (yang dinilai) — form ini
                    // cuma butuh mitra sebagai target penilaian.
                    this.rosterList = (result.data || []).filter(p => p.tipe === 'mitra');
                } catch (error) {
                    this.flash = { type: 'error', message: error.message };
                } finally {
                    this.loadingRoster = false;
                }
            },

            filteredRoster() {
                const query = this.petugasSearch.trim().toLowerCase();
                if (!query) return this.rosterList;
                return this.rosterList.filter(p => p.nama.toLowerCase().includes(query) || p.idsobat.toLowerCase().includes(query));
            },

            selectPetugas(p) {
                this.selected = p;
                this.petugasSearch = p.nama;
                this.showPetugasDropdown = false;
                if (p.kecamatan) this.form_kecamatan = p.kecamatan;
            },

            initials(nama) {
                if (!nama) return '?';
                const parts = nama.trim().split(/\s+/);
                return (parts[0][0] + (parts.length > 1 ? parts[parts.length - 1][0] : '')).toUpperCase();
            },

            async submitPenilaian() {
                if (!this.selected || !this.kegiatanId) return;
                this.submitting = true;
                this.flash = { type: '', message: '' };
                try {
                    const response = await fetch('/api/penilaian', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            kegiatan_id: Number(this.kegiatanId),
                            yang_dinilai_id: this.selected.idsobat,
                            kecamatan: this.form_kecamatan,
                            periode: this.form_periode,
                            tahun: this.form_tahun,
                            tanggal_penilaian: this.form_tanggal,
                            skor_kualitas: this.form.skor_kualitas,
                            skor_ketepatan_waktu: this.form.skor_ketepatan_waktu,
                            skor_kepatuhan_sop: this.form.skor_kepatuhan_sop,
                            skor_komunikasi: this.form.skor_komunikasi,
                            skor_sikap: this.form.skor_sikap,
                            catatan: this.form.catatan,
                        }),
                    });
                    const result = await response.json();
                    if (!response.ok) throw new Error(result?.error?.message || 'Gagal menyimpan penilaian');
                    this.flash = { type: 'success', message: 'Penilaian tersimpan.' };
                    this.selected = null;
                    this.petugasSearch = '';
                    this.form = { skor_kualitas: 80, skor_ketepatan_waktu: 80, skor_kepatuhan_sop: 80, skor_komunikasi: 80, skor_sikap: 80, catatan: '' };
                } catch (error) {
                    this.flash = { type: 'error', message: error.message };
                } finally {
                    this.submitting = false;
                }
            },
        };
    }
</script>
{{ end }}
