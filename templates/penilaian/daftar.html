{{ define "content" }}
<div class="space-y-6 md:space-y-8" x-data="daftarPenilaianPage()" x-init="init()">

    <div class="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4">
        <div>
            <h2 class="text-xl md:text-2xl font-bold text-gray-800">Daftar Penilaian</h2>
            <p class="text-gray-500 mt-1 text-sm md:text-base">Riwayat seluruh penilaian mitra. Klik satu baris untuk melihat rincian skor per aspek.</p>
        </div>
    </div>

    <template x-if="flash.message">
        <div class="rounded-2xl border px-4 py-3 text-sm font-medium"
            :class="flash.type === 'error' ? 'bg-red-50 border-red-200 text-red-700' : 'bg-emerald-50 border-emerald-200 text-emerald-700'">
            <span x-text="flash.message"></span>
        </div>
    </template>

    <!-- Filters -->
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-5 md:p-6">
        <div class="grid md:grid-cols-4 gap-4">
            <div class="relative">
                <label class="block text-xs font-semibold uppercase tracking-wider text-gray-500 mb-2">Kegiatan</label>
                <input type="text" x-model="filters.kegiatanSearch" @input="showKegiatanDropdown = true"
                    @focus="showKegiatanDropdown = true" @click.away="showKegiatanDropdown = false"
                    class="w-full input-with-icon" placeholder="Semua kegiatan...">
                <div x-show="showKegiatanDropdown && filteredKegiatanList().length > 0" x-cloak
                    class="absolute z-20 w-full mt-1 bg-white shadow-xl rounded-xl border border-gray-200 max-h-60 overflow-y-auto">
                    <button type="button" @click="selectKegiatan(null)"
                        class="w-full px-4 py-2.5 text-left hover:bg-blue-50 text-sm text-gray-500 border-b border-gray-100">
                        Semua kegiatan
                    </button>
                    <template x-for="k in filteredKegiatanList()" :key="k.id">
                        <button type="button" @click="selectKegiatan(k)"
                            class="w-full px-4 py-2.5 text-left hover:bg-blue-50 text-sm text-gray-700 border-b border-gray-100 last:border-0">
                            <span x-text="k.nama"></span>
                        </button>
                    </template>
                </div>
            </div>
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-gray-500 mb-2">Tahun</label>
                <select x-model="filters.tahun" @change="load()" class="w-full">
                    <option value="">Semua</option>
                    <template x-for="y in tahunOptions" :key="y">
                        <option :value="y" x-text="y"></option>
                    </template>
                </select>
            </div>
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-gray-500 mb-2">Peran</label>
                <select x-model="filters.peran" @change="load()" class="w-full">
                    <option value="">Semua</option>
                    <option value="ppl">PPL</option>
                    <option value="pml">PML</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-gray-500 mb-2">Kecamatan (Wilayah Tugas)</label>
                <input type="text" x-model="filters.kecamatan" @input.debounce.400ms="load()" class="w-full" placeholder="Semua kecamatan...">
            </div>
        </div>
        <div class="grid md:grid-cols-3 gap-4 mt-4">
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-gray-500 mb-2">Predikat</label>
                <select x-model="filters.predikat" @change="load()" class="w-full">
                    <option value="">Semua</option>
                    <option value="Sangat Baik">Sangat Baik</option>
                    <option value="Baik">Baik</option>
                    <option value="Cukup">Cukup</option>
                    <option value="Perlu Pembinaan">Perlu Pembinaan</option>
                </select>
            </div>
            <div class="md:col-span-2 relative">
                <label class="block text-xs font-semibold uppercase tracking-wider text-gray-500 mb-2">Cari</label>
                <span class="form-icon" style="top: 34px;"><i class="fas fa-magnifying-glass"></i></span>
                <input type="text" x-model="filters.search" @input.debounce.400ms="load()"
                    class="w-full input-with-icon" placeholder="Cari nama / ID Sobat mitra...">
            </div>
        </div>
    </div>

    <!-- Table -->
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
        <div class="px-5 py-4 border-b border-gray-100 flex items-center justify-between">
            <h3 class="font-semibold text-gray-900">Rekapitulasi Nilai Mitra</h3>
            <span class="inline-flex px-2.5 py-1 rounded-full text-xs font-semibold bg-blue-100 text-blue-700"
                x-text="items.length + ' data'"></span>
        </div>

        <template x-if="loading">
            <div class="p-6 text-sm text-primary inline-flex items-center">
                <i class="fas fa-spinner fa-spin mr-2"></i> Memuat data...
            </div>
        </template>

        <template x-if="!loading && items.length === 0">
            <div class="p-10 text-center">
                <div class="w-16 h-16 rounded-full bg-gray-100 flex items-center justify-center mx-auto mb-4">
                    <i class="fas fa-inbox text-2xl text-gray-400"></i>
                </div>
                <h3 class="text-base font-semibold text-gray-700">Belum Ada Data</h3>
                <p class="text-sm text-gray-500 mt-1">Tidak ada penilaian sesuai filter saat ini.</p>
            </div>
        </template>

        <div class="overflow-x-auto" x-show="!loading && items.length > 0">
            <table class="w-full text-sm">
                <thead class="bg-gray-50 text-gray-600">
                    <tr>
                        <th class="px-4 py-3 text-left font-semibold">Nama Mitra</th>
                        <th class="px-4 py-3 text-left font-semibold">Kegiatan</th>
                        <th class="px-4 py-3 text-left font-semibold">Periode</th>
                        <th class="px-4 py-3 text-left font-semibold">Kecamatan</th>
                        <th class="px-4 py-3 text-center font-semibold">Peran</th>
                        <th class="px-4 py-3 text-center font-semibold">Status</th>
                        <th class="px-4 py-3 text-right font-semibold">Skor Akhir</th>
                        <th class="px-4 py-3 text-center font-semibold">Predikat</th>
                        <th class="px-4 py-3 text-center font-semibold">Aksi</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-gray-100">
                    <template x-for="item in items" :key="item.periode_id + '-' + item.idsobat">
                        <tr class="hover:bg-gray-50">
                            <td class="px-4 py-3 font-medium text-gray-900" x-text="item.nama_mitra"></td>
                            <td class="px-4 py-3 text-gray-600" x-text="item.kegiatan"></td>
                            <td class="px-4 py-3 text-gray-600" x-text="(item.periode || '-') + ' ' + (item.tahun || '')"></td>
                            <td class="px-4 py-3 text-gray-600" x-text="item.kecamatan || '-'"></td>
                            <td class="px-4 py-3 text-center">
                                <span class="inline-flex px-2 py-0.5 rounded-full text-xs font-semibold bg-gray-100 text-gray-600" x-text="item.peran"></span>
                            </td>
                            <td class="px-4 py-3 text-center">
                                <span class="inline-flex px-2 py-0.5 rounded-full text-xs font-semibold" :class="statusClass(item)" x-text="statusLabel(item)"></span>
                            </td>
                            <td class="px-4 py-3 text-right font-bold text-primary" x-text="item.skor_akhir !== null ? item.skor_akhir.toFixed(1) : '-'"></td>
                            <td class="px-4 py-3 text-center">
                                <span x-show="item.predikat" class="inline-flex px-2.5 py-1 rounded-full text-xs font-semibold" :class="predikatClass(item.predikat)" x-text="item.predikat"></span>
                                <span x-show="!item.predikat">-</span>
                            </td>
                            <td class="px-4 py-3 text-center">
                                <button type="button" @click="openDetail(item)" class="text-primary hover:text-primary-dark font-medium">
                                    <i class="fas fa-eye mr-1"></i> Detail
                                </button>
                            </td>
                        </tr>
                    </template>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Detail Modal (riwayat per aspek) -->
    <div x-show="detailOpen" x-cloak x-transition class="fixed inset-0 z-50 flex items-center justify-center p-4"
        style="background: rgba(15, 23, 42, 0.5);">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-3xl overflow-hidden max-h-[90vh] overflow-y-auto" @click.outside="detailOpen = false">
            <div class="px-6 py-4 border-b border-gray-100 flex items-center justify-between">
                <h3 class="font-semibold text-gray-900">Detail Penilaian Kinerja Mitra</h3>
                <button @click="detailOpen = false" class="w-9 h-9 rounded-full hover:bg-gray-100 text-gray-500">
                    <i class="fas fa-times"></i>
                </button>
            </div>

            <template x-if="detailLoading">
                <div class="p-8 text-sm text-primary inline-flex items-center">
                    <i class="fas fa-spinner fa-spin mr-2"></i> Memuat detail...
                </div>
            </template>

            <template x-if="!detailLoading && detail">
                <div class="p-6 space-y-6">
                    <div class="grid md:grid-cols-3 gap-4">
                        <div class="bg-gray-50 rounded-2xl p-4">
                            <p class="text-xs font-semibold uppercase text-gray-500 mb-2">Informasi Mitra & Kegiatan</p>
                            <p class="font-semibold text-gray-900" x-text="detail.nama_mitra"></p>
                            <p class="text-xs text-gray-500 mb-2" x-text="detail.peran"></p>
                            <dl class="text-xs text-gray-600 space-y-1">
                                <div class="flex justify-between"><dt>Kegiatan</dt><dd class="text-right" x-text="detail.kegiatan"></dd></div>
                                <div class="flex justify-between"><dt>Kecamatan</dt><dd x-text="detail.kecamatan || '-'"></dd></div>
                                <div class="flex justify-between"><dt>Periode</dt><dd x-text="(detail.periode || '-') + ' ' + (detail.tahun || '')"></dd></div>
                                <div class="flex justify-between"><dt>Tanggal Penilaian</dt><dd x-text="detail.tanggal_penilaian || '-'"></dd></div>
                                <div class="flex justify-between"><dt>Dinilai Oleh</dt><dd x-text="detail.nama_penilai_awal || '-'"></dd></div>
                            </dl>
                        </div>
                        <div class="bg-gray-50 rounded-2xl p-4 text-center flex flex-col items-center justify-center">
                            <p class="text-xs font-semibold uppercase text-gray-500 mb-2">Skor Akhir</p>
                            <p class="text-3xl font-bold" :class="detail.skor_akhir !== null ? 'text-emerald-600' : 'text-gray-400'"
                                x-text="detail.skor_akhir !== null ? detail.skor_akhir.toFixed(1) : '-'"></p>
                            <span x-show="detail.predikat" class="mt-2 inline-flex px-2.5 py-1 rounded-full text-xs font-semibold" :class="predikatClass(detail.predikat)" x-text="detail.predikat"></span>
                            <span x-show="!detail.predikat" class="mt-2 inline-flex px-2.5 py-1 rounded-full text-xs font-semibold bg-amber-100 text-amber-700" x-text="statusLabel(detail)"></span>
                        </div>
                        <div class="bg-gray-50 rounded-2xl p-4">
                            <p class="text-xs font-semibold uppercase text-gray-500 mb-2">Ringkasan Aspek (Penilaian Awal)</p>
                            <div class="space-y-2">
                                <template x-for="a in detail.aspek_awal" :key="a.label">
                                    <div>
                                        <div class="flex justify-between text-xs text-gray-600 mb-0.5">
                                            <span x-text="a.label"></span>
                                            <span x-text="a.skor.toFixed(0) + '/100'"></span>
                                        </div>
                                        <div class="w-full bg-gray-200 rounded-full h-1.5">
                                            <div class="bg-emerald-500 h-1.5 rounded-full" :style="'width:' + a.skor + '%'"></div>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </div>

                    <template x-if="detail.aspek_ulang && detail.aspek_ulang.length">
                        <div class="bg-amber-50 border border-amber-200 rounded-2xl p-4">
                            <p class="text-xs font-semibold uppercase text-amber-700 mb-2">
                                Penilaian Ulang Subject Matter (<span x-text="detail.nama_penilai_ulang"></span>) &mdash; skor ulang: <span x-text="detail.skor_ulang ? detail.skor_ulang.toFixed(1) : '-'"></span>
                            </p>
                            <div class="grid sm:grid-cols-2 gap-3">
                                <template x-for="a in detail.aspek_ulang" :key="a.label">
                                    <div>
                                        <div class="flex justify-between text-xs text-gray-600 mb-0.5">
                                            <span x-text="a.label"></span>
                                            <span x-text="a.skor.toFixed(0) + '/100'"></span>
                                        </div>
                                        <div class="w-full bg-amber-200 rounded-full h-1.5">
                                            <div class="bg-amber-500 h-1.5 rounded-full" :style="'width:' + a.skor + '%'"></div>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </template>

                    <template x-if="detail.catatan">
                        <div class="bg-gray-50 rounded-2xl p-4">
                            <p class="text-xs font-semibold uppercase text-gray-500 mb-1">Catatan Tambahan</p>
                            <p class="text-sm text-gray-700" x-text="detail.catatan"></p>
                        </div>
                    </template>
                </div>
            </template>
        </div>
    </div>
</div>

<script>
    function daftarPenilaianPage() {
        return {
            items: [],
            kegiatanList: [],
            tahunOptions: [],
            filters: { kegiatanId: '', kegiatanSearch: '', tahun: '', peran: '', kecamatan: '', predikat: '', search: '' },
            showKegiatanDropdown: false,
            loading: false,
            flash: { type: '', message: '' },
            detailOpen: false,
            detailLoading: false,
            detail: null,

            init() {
                for (let y = new Date().getFullYear(); y >= new Date().getFullYear() - 4; y--) {
                    this.tahunOptions.push(String(y));
                }
                this.loadKegiatan();
                this.load();
            },

            async loadKegiatan() {
                try {
                    const response = await fetch('/api/penilaian/kegiatan');
                    if (!response.ok) throw new Error('Gagal memuat kegiatan');
                    const result = await response.json();
                    this.kegiatanList = (result.data || []).map(k => ({ id: k.id, nama: k.nama }));
                } catch (error) {
                    this.flash = { type: 'error', message: error.message };
                }
            },

            filteredKegiatanList() {
                const q = this.filters.kegiatanSearch.trim().toLowerCase();
                if (!q) return this.kegiatanList;
                return this.kegiatanList.filter(k => k.nama.toLowerCase().includes(q));
            },

            selectKegiatan(k) {
                this.filters.kegiatanId = k ? k.id : '';
                this.filters.kegiatanSearch = k ? k.nama : '';
                this.showKegiatanDropdown = false;
                this.load();
            },

            statusLabel(item) {
                if (item.peran === 'PPL') return 'Final';
                if (item.status_konfirmasi === 'disetujui') return 'Disetujui';
                if (item.status_konfirmasi === 'ditolak') return item.skor_ulang !== undefined && item.skor_ulang !== null ? 'Final (Rata-rata)' : 'Ditolak - Menunggu Nilai Ulang';
                return 'Menunggu Konfirmasi';
            },

            statusClass(item) {
                if (item.peran === 'PPL' || item.status_konfirmasi === 'disetujui') return 'bg-emerald-100 text-emerald-700';
                if (item.status_konfirmasi === 'ditolak') return (item.skor_ulang !== undefined && item.skor_ulang !== null) ? 'bg-emerald-100 text-emerald-700' : 'bg-red-100 text-red-700';
                return 'bg-amber-100 text-amber-700';
            },

            predikatClass(predikat) {
                switch (predikat) {
                    case 'Sangat Baik': return 'bg-emerald-100 text-emerald-700';
                    case 'Baik': return 'bg-blue-100 text-blue-700';
                    case 'Cukup': return 'bg-amber-100 text-amber-700';
                    default: return 'bg-red-100 text-red-700';
                }
            },

            params() {
                const p = new URLSearchParams();
                if (this.filters.kegiatanId) p.set('kegiatan_id', this.filters.kegiatanId);
                if (this.filters.tahun) p.set('tahun', this.filters.tahun);
                if (this.filters.peran) p.set('peran', this.filters.peran);
                if (this.filters.kecamatan) p.set('kecamatan', this.filters.kecamatan);
                if (this.filters.predikat) p.set('predikat', this.filters.predikat);
                if (this.filters.search) p.set('search', this.filters.search);
                return p;
            },

            async load() {
                this.loading = true;
                try {
                    const response = await fetch('/api/penilaian/daftar?' + this.params().toString());
                    if (!response.ok) throw new Error('Gagal memuat daftar penilaian');
                    const result = await response.json();
                    this.items = result.data || [];
                } catch (error) {
                    this.flash = { type: 'error', message: error.message };
                } finally {
                    this.loading = false;
                }
            },

            async openDetail(item) {
                this.detailOpen = true;
                this.detailLoading = true;
                this.detail = null;
                try {
                    const response = await fetch('/api/penilaian/detail?periode_id=' + item.periode_id + '&idsobat=' + encodeURIComponent(item.idsobat));
                    if (!response.ok) throw new Error('Gagal memuat detail penilaian');
                    this.detail = await response.json();
                } catch (error) {
                    this.flash = { type: 'error', message: error.message };
                    this.detailOpen = false;
                } finally {
                    this.detailLoading = false;
                }
            },
        };
    }
</script>
{{ end }}
