version: '3.8'

services:
  app-sirekap:
    build: .
    container_name: sirekap
    restart: unless-stopped
    ports:
      - '8051:8051'
    environment:
      # Nilai diisi di Coolify UI → Environment Variables
      # JANGAN tulis nilai di sini, biarkan kosong agar dibaca dari env Coolify
      - PORT
      - DB_HOST
      - DB_PORT
      - DB_USER
      - DB_PASS
      - DB_NAME
      - SESSION_KEY
      - SESSION_SECURE
      - AWS_ENDPOINT_URL
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
      - AWS_BUCKET
      - AWS_DEFAULT_REGION
      - AWS_USE_PATH_STYLE_ENDPOINT
    networks:
      - coolify

networks:
  coolify:
    external: true
